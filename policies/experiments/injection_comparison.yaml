# Injection detectors kept for comparison only (not in the production policies/guard.yaml, so
# they add no latency there). All shadow, at thresholds tuned on dev at a ≤2% FPR budget.
#   uv run boundary-eval detectors --suite extended --policies policies/experiments/injection_comparison.yaml --out ...
# Prompt Guard is gated: needs HF access + a token (`uv run hf auth login` or HF_TOKEN).
version: 1

defaults:
  timeout_ms: 10000
  mode: shadow

policies:
  - id: user_injection_protectai
    stages: [user_input]
    detects: [injection, jailbreak]
    detector:
      type: hf_classifier
      model: protectai/deberta-v3-base-prompt-injection-v2
      revision: 90c9989b1a342275dd0d1a95aad283c04e075671
      positive_labels: [INJECTION]
      threshold: 0.0103   # dev: 77.3% catch at 0.6% FPR
      chunking: { max_tokens: 512, overlap_tokens: 64, max_chunks: 16 }
    action: block

  - id: tool_output_injection_promptguard
    stages: [tool_output]
    detects: [injection]
    detector:
      type: hf_classifier
      model: meta-llama/Llama-Prompt-Guard-2-86M
      revision: a8ded8e697ce7c355e395a0df51f94adb4a2fd27
      positive_labels: [LABEL_1]
      threshold: 0.9972   # dev: 18.4% catch at 0% FPR
      chunking: { max_tokens: 512, overlap_tokens: 64, max_chunks: 16 }
    action: block

  - id: tool_output_injection_promptguard_22m
    stages: [tool_output]
    detects: [injection]
    detector:
      type: hf_classifier
      model: meta-llama/Llama-Prompt-Guard-2-22M
      revision: 11614a155199674a0a95e6602d6ab0417b790ed0
      positive_labels: [LABEL_1]
      threshold: 0.9983   # dev: 18.4% catch at 0% FPR
      chunking: { max_tokens: 512, overlap_tokens: 64, max_chunks: 16 }
    action: block
