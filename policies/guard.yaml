# Guard policy set. Bump `version` on any change and add a CHANGELOG.md entry.
# Paths are relative to this file. Model revisions are pinned commit SHAs on the HF Hub.
#
# This is the production set: the enforced detectors plus cheap regex baselines in shadow. Detectors kept only for comparison live in policies/experiments/ so they don't add
# latency here. Thresholds are tuned on the dev split at a ≤2% dev false-positive budget
# (`boundary-eval tune <result> --max-fpr 0.02`); see docs/EVAL.md for the sweep.
version: 3

defaults:
  timeout_ms: 400
  on_error: fail_closed
  mode: enforce
  execution: blocking

policies:
  # ---- user input ------------------------------------------------------------------------
  - id: user_injection_promptguard
    description: Prompt injection / jailbreak in the user's request (Llama Prompt Guard 2 86M; gated model, needs HF access).
    stages: [user_input]
    detects: [injection, jailbreak]
    detector:
      type: hf_classifier
      model: meta-llama/Llama-Prompt-Guard-2-86M
      revision: a8ded8e697ce7c355e395a0df51f94adb4a2fd27
      positive_labels: [LABEL_1]
      # Model default. The dev-tuned 0.0116 sat in the tail of a bimodal score distribution and its
      # dev FPR (1.3%) did not hold on extended test (3.4%); see docs/EVAL.md "Operating points".
      threshold: 0.5
      chunking: { max_tokens: 512, overlap_tokens: 64, max_chunks: 16 }
    action: block
    timeout_ms: 5000

  - id: jailbreak_patterns
    description: Heuristic instruction-override / jailbreak phrasing. Baseline for the ML detectors.
    stages: [user_input]
    detects: [injection, jailbreak]
    detector:
      type: regex_rules
      ruleset: rules/jailbreak.v1.yaml
    action: block
    mode: shadow

  - id: topic
    description: Requests outside the research assistant's purpose (nearest-exemplar embeddings).
    stages: [user_input]
    detects: [off_topic]
    detector:
      type: embeddings_topic
      model: sentence-transformers/all-MiniLM-L6-v2
      revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      allow: topics/research.v1.yaml
      deny: topics/deny.v1.yaml
      margin: 0.0
    action: block
    timeout_ms: 1000

  # ---- tool output (indirect injection) ---------------------------------------------------
  - id: tool_output_injection_protectai
    description: >-
      Indirect prompt injection in tool output (ProtectAI DeBERTa-v3, chunked, max over chunks).
      Shadow: no off-the-shelf detector is fit to block tool output (this one withholds legitimate
      docs pages). Its verdict is the run-taint signal (Phase 5); blocking waits for our detector.
    stages: [tool_output]
    detects: [injection]
    detector:
      type: hf_classifier
      model: protectai/deberta-v3-base-prompt-injection-v2
      revision: 90c9989b1a342275dd0d1a95aad283c04e075671
      positive_labels: [INJECTION]
      threshold: 0.9963   # dev: 30.6% catch at 1.5% FPR
      chunking: { max_tokens: 512, overlap_tokens: 64, max_chunks: 16 }
    action: block
    mode: shadow
    timeout_ms: 10000

  - id: tool_output_injection_heuristic
    description: Instruction-override phrasing inside tool output. Cheap baseline for the ML detectors.
    stages: [tool_output]
    detects: [injection]
    detector:
      type: regex_rules
      ruleset: rules/jailbreak.v1.yaml
      rules: [ignore_previous, new_instructions, system_prompt_override, role_hijack, hidden_directive]
    action: block
    mode: shadow

  # ---- secrets and PII (several stages) ---------------------------------------------------
  - id: secrets
    description: Credentials and API keys in outgoing tool args, tool output, or the final answer.
    stages: [tool_args, tool_output, final_output]
    detects: [secret]
    detector:
      type: regex_rules
      ruleset: rules/secrets.v1.yaml
    action: block

  - id: pii
    description: Personal data in the request, tool output or answer, replaced with typed placeholders.
    stages: [user_input, tool_output, final_output]
    detects: [pii]
    detector: &presidio
      type: presidio
      entities: [EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, US_SSN, IBAN_CODE, IP_ADDRESS]
      score_threshold: 0.5
      spacy_model: en_core_web_sm
    action: redact
    timeout_ms: 2000

  - id: pii_egress
    description: Personal data leaving through tool arguments (search queries, URLs, emails). Arguments are never rewritten, so this blocks.
    stages: [tool_args]
    detects: [pii]
    detector: *presidio
    action: block
    timeout_ms: 2000

  # ---- final output -----------------------------------------------------------------------
  - id: research_note_schema
    description: Final answers requested as a research note must match the schema (after JSON repair).
    stages: [final_output]
    detects: [schema_invalid]
    detector:
      type: json_schema
      schema: schemas/research_note.v1.json
    action: block

  - id: toxicity
    description: Toxic, insulting or threatening answers (unitary/toxic-bert, max over its toxicity labels).
    stages: [final_output]
    detects: [toxicity]
    detector:
      type: hf_classifier
      model: unitary/toxic-bert
      revision: 4d6c22e74ba2fdd26bc4f7238f50766b045a0d94
      positive_labels: [toxic, severe_toxic, obscene, threat, insult, identity_hate]
      multi_label: true
      threshold: 0.119   # dev: 85.7% catch at 1.8% FPR
    action: block
    timeout_ms: 5000

  - id: groundedness
    description: >-
      Answer claims not supported by the tool outputs read (NLI, mean over claims). Async, flag only,
      and shadow: near chance on HaluEval summaries (dev AUC ~0.6), kept as the baseline for the
      LLM judge in Phase 6. Threshold not tuned for that reason.
    stages: [final_output]
    detects: [hallucination]
    detector:
      type: nli_groundedness
      model: cross-encoder/nli-deberta-v3-base
      revision: 6c749ce3425cd33b46d187e45b92bbf96ee12ec7
      aggregate: mean
      threshold: 0.5
    action: flag
    mode: shadow
    execution: async
    timeout_ms: 20000
