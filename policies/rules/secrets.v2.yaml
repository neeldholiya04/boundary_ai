# Secret / credential patterns, adapted from common gitleaks rules.
# Test-mode keys (sk_test_, pk_) are deliberately not matched: they are the benign decoys.
#
# v2 (policy v5): v1 only knew full-length key shapes, so a short `sk-proj-…` key, a legacy `sk-…`
# key, any `OPENAI_API_KEY=…` line and "my key is …" phrasing all passed every stage. v2 adds
# provider prefixes, fixes the assignment rule's word boundary (`\bapi` never matched inside
# `OPENAI_API_KEY`), matches natural phrasing, URL and header credentials, and backs the named rules
# with high-entropy rules for formats nobody listed.
#
# Rule order matters for redaction: when two rules match the same span, the earlier rule's label
# names the placeholder, so the specific rules come before the generic ones.
#
# Every pattern must stay linear on adversarial input (long whitespace or token runs): the guard
# tests time each rule on 20k-char inputs. Never put two `\s*` side by side around an optional token.
#
# v2.1 (policy v8): a typed key (`sk-proj-` + 34 lowercase letters from 8 keys) passed every stage
# because the OpenAI rule wanted a digit, a capital and 3 bits/char. A provider prefix is the
# evidence; randomness isn't. Prefixed keys now match whatever their body looks like (placeholders
# are still allowed), `*_API_KEY=` / `*_TOKEN=` lines match any non-placeholder value, and "this
# key there: …" phrasing is matched.
#
# v2.2 (policy v9): a typed `sk-ant-` + 15 letters passed, the same failure for another provider.
# Two layers now: (1) formats: the ~220 provider rules of gitleaks, imported and pinned
# (providers.gitleaks.yaml, below); (2) context: a known provider prefix followed by key characters
# counts at any length or shape, and a credential-named line in an .env file counts whatever its
# case. Formats catch real keys; context catches typed, truncated and made-up ones.
name: secrets
version: 2.2
include:
  - providers.gitleaks.yaml

# Regexes tested against the captured value; a match suppresses the finding.
allowlist:
  - 'EXAMPLE'
  - '^(?:x+|X+|\*+|0+)$'
  # Placeholders people write in docs and templates: sk-xxxx, YOUR_API_KEY, <api-key>, ${OPENAI_API_KEY}.
  - '(?i)^(?:sk-)?(?:x{4,}|\.{3,}|your[_-]?(?:api[_-]?)?key(?:[_-]?here)?|<[^>]*>|\$\{[^}]*\})$'
  - '(?i)(?:your|my|example|sample|dummy|placeholder|redacted|replace)[_-]?(?:api[_-]?)?(?:key|token|secret)'
  # Elided or stand-in values: `ya29.a0Af...`, `<token>…placeholder`.
  - '(?i)\.\.\.|…|placeholder'
  # A body of one repeated character (sk-proj-aaaa…, sk-proj-0000…), or the whole value is a reference
  # to another variable ($OPENAI_API_KEY, ${X}, %API_KEY%, {{ secrets.X }}). Anchored at both ends:
  # real passwords and URL-encoded values can start with `$` or `%`.
  - '^(?:sk-(?:proj|svcacct|admin|None)-)?([A-Za-z0-9])\1*$'
  - '^(?:\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|%[A-Za-z_][A-Za-z0-9_]*%|\{\{.*\}\})$'
  # Template values: your-openai-api-key, change-me-in-production, REPLACE_ME, undefined.
  - '(?i)your[\w-]*(?:key|token|secret)|change[-_]?me|replace[-_]?me'
  - '(?i)^(?:undefined|required|none|null|development|production)$'
  # Well-known default passwords in dev connection strings and compose files.
  - '(?i)^(?:postgres|password|root|admin|changeme|secret|test|guest)$'
  # Subresource-integrity and lockfile hashes (sha512-<base64>): public, not credentials.
  - '^sha(?:1|256|384|512)-'
  # Stripe test-mode and publishable keys are meant to appear in docs and frontends.
  - '^(?:sk|rk|pk)_test_|^pk_live_'
  # Public values that look random: ssh public key bodies, IPFS CIDv0, Bitcoin addresses.
  - '^AAAA[BC]3NzaC1'
  - '^Qm[1-9A-HJ-NP-Za-km-z]{44}$'
  - '^[13][1-9A-HJ-NP-Za-km-z]{25,34}$'
  # Start of base64-encoded files (PNG, JPEG, GIF, WEBP, SVG, XML, PDF) in data: URIs and JSON.
  - '^(?:iVBORw0KGgo|/9j/|R0lGOD|UklGR|PHN2Zy|PD94bWwg|JVBERi0)'
  # DER bodies of PEM public keys and certificates (private keys are caught by their BEGIN line).
  - '^MII[A-Za-z0-9+/]{8}'

rules:
  - id: aws_access_key_id
    label: AWS_KEY
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'

  - id: aws_secret_access_key
    label: AWS_SECRET
    pattern: '(?i)aws.{0,20}?(?:secret|private).{0,20}?[''"\s:=]+(?P<v>[A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    group: v
    min_entropy: 3.5

  - id: github_token
    label: GITHUB_TOKEN
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{60,255})\b'

  - id: gitlab_token
    label: GITLAB_TOKEN
    pattern: '\bglpat-[A-Za-z0-9_-]{20,}\b'

  # OpenAI project/service/admin keys: the prefix is the evidence, so the body only needs 20+ key
  # characters, whatever they look like. A key someone typed by hand (`sk-proj-asdfjkl…`) is still a
  # key; placeholders (`sk-proj-your-key-here`, `sk-proj-xxxx…`) are caught by the allowlist, and
  # hyphenated words (`sk-proj-management-dashboard-v2`) are not keys.
  - id: openai_prefixed_key
    label: OPENAI_KEY
    pattern: '(?<![A-Za-z0-9_-])sk-(?:proj|svcacct|admin|None)-(?![a-z]+(?:-[a-z0-9]+){2,}(?![A-Za-z0-9_]))[A-Za-z0-9_-]{20,}'

  # Legacy keys (`sk-` + 48) and keys with the T3BlbkFJ marker. A bare `sk-` is common in prose and
  # package names, so the body must mix digits and capitals (`sk-learn-compatible-…` doesn't match).
  # `sk-ant-` is Anthropic's (own rule below); `sk_test_` / `sk_live_` use `_`.
  - id: openai_key
    label: OPENAI_KEY
    pattern: '(?<![A-Za-z0-9_-])sk-(?!ant-)(?=[A-Za-z0-9_-]*[0-9])(?=[A-Za-z0-9_-]*[A-Z])[A-Za-z0-9_-]{20,}'
    min_entropy: 3.0

  - id: anthropic_key
    label: ANTHROPIC_KEY
    pattern: '\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{20,}'

  # Ends at the first character that can't be in a key: a key ending in `-` or `_` has no word
  # boundary after it, so `\b` there missed every such key.
  - id: google_api_key
    label: GOOGLE_API_KEY
    pattern: '\bAIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z_-])'

  - id: groq_key
    label: GROQ_KEY
    pattern: '\bgsk_[A-Za-z0-9]{32,}\b'

  - id: huggingface_token
    label: HF_TOKEN
    pattern: '\bhf_[A-Za-z0-9]{30,}\b'

  - id: xai_key
    label: XAI_KEY
    pattern: '\bxai-[A-Za-z0-9]{40,}\b'

  - id: npm_token
    label: NPM_TOKEN
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'

  - id: sendgrid_key
    label: SENDGRID_KEY
    pattern: '\bSG\.[A-Za-z0-9_-]{16,32}\.[A-Za-z0-9_-]{30,64}\b'

  - id: mailgun_key
    label: MAILGUN_KEY
    pattern: '\bkey-[0-9a-z]{32}\b'

  - id: shopify_token
    label: SHOPIFY_TOKEN
    pattern: '\bshp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}\b'

  - id: twilio_api_key
    label: TWILIO_KEY
    pattern: '\bSK[0-9a-f]{32}\b'

  - id: slack_token
    label: SLACK_TOKEN
    pattern: '\bxox[baprse]-[0-9A-Za-z-]{10,}\b'

  # Incoming-webhook URLs are bearer credentials: anyone holding one can post.
  - id: webhook_url
    label: WEBHOOK_URL
    pattern: 'https://(?:hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]{16,}|(?:discord|discordapp)\.com/api/webhooks/\d+/[A-Za-z0-9_-]{30,})'

  - id: stripe_live_key
    label: STRIPE_KEY
    pattern: '\b(?:sk|rk)_live_[0-9A-Za-z]{24,}\b'

  # Ends at the END line, or where a quoted/escaped string ends (a key inside a JSON value), so a
  # truncated key never swallows the rest of a structured tool result. PUBLIC KEY blocks don't match.
  - id: private_key_block
    label: PRIVATE_KEY
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----(?:[A-Za-z0-9+/=\s:,.-]|\\[nr])*?(?:-----END [A-Z ]*PRIVATE KEY(?: BLOCK)?-----|(?=["'']|\\(?![nr])|\Z))'

  - id: jwt
    label: JWT
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

  # user:password@host in any URL (databases, brokers, git remotes, HTTP basic auth).
  - id: connection_string_password
    label: DB_PASSWORD
    pattern: '\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqps?|https?|ftp|ssh|git)://[^\s:/@]+:(?P<v>[^\s@/]{6,})@'
    group: v
    min_entropy: 2.5

  - id: authorization_header
    label: SECRET
    pattern: '(?i)(?:\bauthorization\s*:\s*(?:bearer|token|basic)|\bbearer)\s+(?P<v>[A-Za-z0-9._~+/=-]{20,})'
    group: v
    min_entropy: 3.0  # the header is strong context, and hex tokens top out near 3.7 bits/char

  # ?api_key=… / &appid=… / &access_token=… in URLs.
  - id: url_query_credential
    label: SECRET
    pattern: '(?i)[?&](?:api[_-]?key|apikey|appid|access[_-]?token|auth[_-]?token|token|key|secret|client[_-]?secret|sig)=(?P<v>[^&\s#"'']{16,})'
    group: v
    min_entropy: 3.5

  # Environment variables named as credentials (OPENAI_API_KEY, DB_PASSWORD, PGPASSWORD, HF_TOKEN):
  # the name says it is a secret, so in a .env or shell line (`NAME=value`, `NAME="value"`) any value
  # counts, however plain. Upper-case names only. Not public frontend variables (NEXT_PUBLIC_, VITE_,
  # …) or names for something else (INVALID_TOKEN, MAX_TOKEN, HEADER_API_KEY), and not a function call
  # (`SECRET_KEY=get_random_secret_key()`). Templates and references are in the allowlist.
  - id: env_credential
    label: SECRET
    pattern: '(?<![A-Za-z0-9_])(?!(?:NEXT_PUBLIC|PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|INVALID|EXPIRED|ERROR|HEADER|MAX|MIN|DEFAULT)_)(?:[A-Z][A-Z0-9]*_)*(?:PG)?(?:API_?KEY|SECRET(?:_KEY)?|TOKEN|PASS(?:WORD|WD)?|ACCESS_KEY|PRIVATE_KEY|AUTH_KEY)=["'']?(?P<v>(?![A-Za-z0-9_.]{0,64}\()[A-Za-z0-9][^\s"''`;,()\[\]{}<>]{7,})'
    group: v

  # The same names in code, YAML or JSON (`NAME = "…"`, `NAME: …`, `"NAME": "…"`, the `env` block of
  # an MCP config). Here a plain word is usually a constant (`CSRF_TOKEN = 'csrftoken'`) or a reference
  # (`settings.API_TOKEN`), so the value must mix letters and digits.
  - id: env_credential_mapping
    label: SECRET
    pattern: '(?<![A-Za-z0-9_])(?!(?:NEXT_PUBLIC|PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|INVALID|EXPIRED|ERROR|HEADER|MAX|MIN|DEFAULT)_)(?:[A-Z][A-Z0-9]*_)*(?:PG)?(?:API_?KEY|SECRET(?:_KEY)?|TOKEN|PASS(?:WORD|WD)?|ACCESS_KEY|PRIVATE_KEY|AUTH_KEY)["'']?[ \t]?[:=][ \t]?["'']?(?P<v>(?![A-Za-z0-9_.]{0,64}\()(?=[^\s"''`;,()\[\]{}<>]{0,64}?[0-9])(?=[^\s"''`;,()\[\]{}<>]{0,64}?[A-Za-z])[A-Za-z0-9][^\s"''`;,()\[\]{}<>]{7,})'
    group: v

  # NAME=value / "name": "value". The name may carry a prefix (OPENAI_API_KEY, DB_PASSWORD), so the
  # left edge is "not a letter or digit" rather than \b, which `_` would defeat. A value that is code
  # reading something else (`settings.API_TOKEN`, `os.environ`) is skipped: dotted names with no digits.
  - id: generic_assignment
    label: SECRET
    pattern: '(?i)(?<![A-Za-z0-9])(?:api[_-]?key|secret(?:[_-]?key)?|access[_-]?token|auth[_-]?token|token|client[_-]?secret|private[_-]?key|account[_-]?key|shared[_-]?access[_-]?key|key)["'']?\s*[:=]\s*["'']?(?P<v>(?![a-z_]++(?:\.[a-z_]++)++(?![A-Za-z0-9_\-/+=.]))[A-Za-z0-9_\-/+=.]{16,})'
    group: v
    min_entropy: 3.8

  # Passwords keep symbols and can be short, so they get their own value class: 8+ characters with a
  # letter and a digit, stopping at quotes, spaces and code punctuation (`os.environ["…"]` never matches).
  # Written as an assignment (`password: …`) or in prose (`the password is …`).
  - id: password_assignment
    label: PASSWORD
    pattern: '(?i)(?<![A-Za-z0-9])(?:passw(?:or)?d|passwd|pwd|passphrase)["'']?(?:\s*[:=]\s*|\s+(?:is|was)\s*(?:[:=]\s*)?)["''`]?(?P<v>(?=[^\s"''`;,()\[\]{}<>]*[0-9])(?=[^\s"''`;,()\[\]{}<>]*[A-Za-z])[^\s"''`;,()\[\]{}<>]{8,})'
    group: v
    min_entropy: 2.8

  # "my api key is …", "the token was: …". Names are compound (a bare "key is" reads as prose), and the
  # separator is one optional `:`/`=` so the whitespace on either side can't backtrack quadratically.
  - id: natural_phrasing
    label: SECRET
    pattern: '(?i)\b(?:api[ _-]?key|secret[ _-]?key|access[ _-]?token|auth[ _-]?token|token|password|passphrase)\s+(?:is|was)\s*(?:[:=]\s*)?["''`]?(?P<v>[A-Za-z0-9_\-/+=.]{16,})'
    group: v
    min_entropy: 3.5

  # "put this key there: …", "here's my new token: …": a credential noun, a few words, then `:` or `=`
  # and the value. The gap can't hold `-`, a newline or a sentence end, and the lookaheads and value
  # are bounded, so a long `key-key-key…` run stays linear. The value must mix letters and digits and
  # look random, so "the key: authorisation" and branch names don't match.
  - id: phrasing_with_separator
    label: SECRET
    pattern: '(?i)\b(?:key|token|secret|password|credential)s?\b[^\n.!?:=-]{0,24}?[:=]\s*["''`]?(?P<v>(?=[A-Za-z0-9_\-/+=.]{0,64}?[0-9])(?=[A-Za-z0-9_\-/+=.]{0,64}?[A-Za-z])[A-Za-z0-9_\-/+=.]{16,256})'
    group: v
    min_entropy: 3.8

  # Layer 2, context: a known provider prefix is the evidence, so what follows counts at any shape
  # (a typed, short or made-up key: `sk-ant-` + 15 letters). Two strengths:
  # - strong prefixes never start an ordinary identifier, so 12+ key characters are enough (any case:
  #   `SK-ANT-…` too);
  # - weak ones also start code names (`hf_classifier`, `npm_publish`, `xai-grok`), so the body must
  #   hold a digit or a capital, or run 20+ characters, and can't be code (`hf_api.HfApi()`).
  # Neither counts a name made of short lower-case segments (`sk-ant-api-docs`, `pplx-70b-chat`,
  # `xai-grok-4.1-fast`, `hf_hub_download`). Prefixes that are ordinary words (AKIA, ops_) aren't
  # listed.
  - id: provider_prefix
    label: SECRET
    pattern: '(?<![A-Za-z0-9_.-])(?i:sk-ant-|sk-proj-|sk-svcacct-|sk-admin-|sk-or-v1-|github_pat_|glpat-|gldt-|glrt-|glptt-|xox[abposr]-|xapp-|AIza|ya29\.|sk_live_|rk_live_|whsec_|shp(?:at|ca|pa|ss)_|do[opr]_v1_|AGE-SECRET-KEY-1|pplx-|nvapi-|lin_api_|sq0(?:atp|csp)-|PMAK-|dckr_pat_|tskey-|sntrys_)(?![a-z0-9]{1,12}(?:[_.-][a-z0-9]{1,12})+(?![A-Za-z0-9_.-]))[A-Za-z0-9_.-]{12,256}(?![(A-Za-z0-9_-])'

  - id: provider_prefix_weak
    label: SECRET
    pattern: '(?<![A-Za-z0-9_.-])(?:gh[pousr]_|gsk_|hf_|xai-|npm_|pypi-|figd_|sbp_|glsa_|hv[sb]\.|pul-)(?![a-z0-9]{1,12}(?:[_-][a-z0-9]{1,12})+(?![A-Za-z0-9_.-]))(?:(?=[A-Za-z0-9_-]{0,256}?[0-9A-Z])[A-Za-z0-9_-]{8,256}|[A-Za-z0-9_-]{20,256})(?![.(A-Za-z0-9_-])'

  # A credential-named line in an .env file or shell script, in any case (`claude_key=…`,
  # `export stripe_secret=…`): the whole line is NAME=value with no indentation, no spaces around `=`
  # and no dots in the name, as .env files and shells write it, so Python (`self.tokenizer =
  # tokenizer`, `    api_key="…"`) doesn't match. A file read by a tool arrives as JSON, so `\n` and
  # the string's quotes count as line edges too. Names for
  # something else (public_key, primary_key, cache_key, key_id, csrf_token, MAX_TOKEN, HEADER_API_KEY,
  # public frontend variables) are skipped, and so are plain numbers and
  # values made of joined lower-case words (`sort_key=created_at`) or code reading another value
  # (`SECRET_KEY = settings.SECRET_KEY`).
  - id: dotenv_credential_line
    label: SECRET
    pattern: '(?:(?m:^)|(?<=\\[nr])|(?<="))(?:export[ \t]+)?(?i:(?!(?:max|min|header|invalid|expired|error|default|public|next_public|vite|react_app|expo_public)[_.-])(?!(?:[a-z0-9]+[_.-])*(?:public|primary|foreign|sort|partition|cache|idempotency|csrf|xsrf|next_public|vite|react_app)[_.-]?(?:key|token)\b)(?![a-z0-9_.-]*key[_.-]?(?:id|name|path|file|length|size|type)\b)[a-z_][a-z0-9_]*(?:key|token|secret|password|passwd|pwd|pass|credential|auth)[a-z0-9_]*)=["'']?(?P<v>(?![0-9]+["'']?[ \t]*(?:(?m:$)|\\[nr]|"))(?![a-z]+(?:[_-][a-z0-9]+)+["'']?[ \t]*(?:(?m:$)|\\[nr]|"))(?![a-z_]+(?:\.[A-Za-z_]+)+["'']?[ \t]*(?:(?m:$)|\\[nr]|"))[A-Za-z0-9][^\s"''`;,()\[\]{}<>\\]{7,})["'']?[ \t]*(?:(?m:$)|(?=\\[nr]|"))'
    group: v

  # Formats no named rule knows: a 32+ character run with upper, lower and digits and high entropy,
  # standing alone (not part of a path, URL segment or base64 blob). Lowercase hex (git SHAs,
  # digests) and UUIDs have no uppercase, so they never match. The 4.5 bar keeps long CamelCase
  # identifiers out. A full stop may follow (end of a sentence), but not a further dotted segment.
  # Base64 of readable text is encoded content, not a key, so it is skipped here; a
  # secret inside it is found by the policy's `decode: [base64]`, which scans the decoded text.
  - id: high_entropy_token
    label: SECRET
    pattern: '(?<![A-Za-z0-9_\-/+=.])(?P<v>(?=[A-Za-z0-9_-]*[0-9])(?=[A-Za-z0-9_-]*[a-z])(?=[A-Za-z0-9_-]*[A-Z])[A-Za-z0-9_-]{32,256})(?![A-Za-z0-9_\-/+=]|\.[A-Za-z0-9_\-/+=])'
    group: v
    min_entropy: 4.5
    exclude_encoded_text: true

  # The same idea for base64-alphabet secrets (AWS secret keys, most HMAC keys): 40+ characters that
  # include `/` or `+`, standing alone (never right after `host.tld` or `scheme:`, so URL paths don't
  # count). Capped at 128: longer runs are encoded files, not keys.
  - id: high_entropy_base64
    label: SECRET
    pattern: '(?<![A-Za-z0-9/+=_.:-])(?P<v>(?=[A-Za-z0-9/+]*[/+])(?=[A-Za-z0-9/+]*[0-9])(?=[A-Za-z0-9/+]*[a-z])(?=[A-Za-z0-9/+]*[A-Z])[A-Za-z0-9/+]{40,128}={0,2})(?![A-Za-z0-9/+=_-])'
    group: v
    min_entropy: 4.5
    exclude_encoded_text: true
