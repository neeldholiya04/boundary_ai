# Secret / credential patterns, adapted from common gitleaks rules.
# Test-mode keys (sk_test_, pk_) are deliberately not matched: they are the benign decoys.
name: secrets
version: 1

# Regexes tested against the captured value; a match suppresses the finding.
allowlist:
  - 'EXAMPLE'
  - '^(?:x+|X+|\*+|0+)$'

rules:
  - id: aws_access_key_id
    label: AWS_KEY
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'

  - id: aws_secret_access_key
    label: AWS_SECRET
    pattern: '(?i)aws.{0,20}?(?:secret|private).{0,20}?[''"\s:=]+(?P<v>[A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    group: v
    min_entropy: 3.5

  - id: github_token
    label: GITHUB_TOKEN
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{60,255})\b'

  - id: openai_key
    label: OPENAI_KEY
    pattern: '\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}\b|\bsk-proj-[A-Za-z0-9_-]{40,}\b'

  - id: anthropic_key
    label: ANTHROPIC_KEY
    pattern: '\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{80,}\b'

  - id: google_api_key
    label: GOOGLE_API_KEY
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'

  - id: slack_token
    label: SLACK_TOKEN
    pattern: '\bxox[baprse]-[0-9A-Za-z-]{10,}\b'

  - id: stripe_live_key
    label: STRIPE_KEY
    pattern: '\b(?:sk|rk)_live_[0-9A-Za-z]{24,}\b'

  - id: private_key_block
    label: PRIVATE_KEY
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----[\s\S]*?(?:-----END [A-Z ]*PRIVATE KEY(?: BLOCK)?-----|\Z)'

  - id: jwt
    label: JWT
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

  - id: connection_string_password
    label: DB_PASSWORD
    pattern: '\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp)://[^\s:/@]+:(?P<v>[^\s@/]{6,})@'
    group: v
    min_entropy: 2.5

  - id: generic_assignment
    label: SECRET
    pattern: '(?i)\b(?:api[_-]?key|secret(?:[_-]?key)?|access[_-]?token|auth[_-]?token|client[_-]?secret|passw(?:or)?d)\b["'']?\s*[:=]\s*["'']?(?P<v>[A-Za-z0-9_\-/+=.]{16,})'
    group: v
    min_entropy: 3.5
