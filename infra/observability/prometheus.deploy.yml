# Prometheus on the deployed server: scrapes the agent over the internal compose network
# (the agent's /metrics is never reachable through the public proxy).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: boundary-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8000"]
        labels:
          service: boundary-agent
          environment: production

  # The server itself: CPU, memory, load, network (observability profile).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: production

  # Each container's CPU and memory, labelled with its compose service (agent, dashboard, ...).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: production
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|spec_memory_limit_bytes|network_(receive|transmit)_bytes_total|cpu_cfs_throttled_seconds_total)
        action: keep
