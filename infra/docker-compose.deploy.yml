# Production stack (one server; see docs/DEPLOY.md). Settings come from the root .env. Deploy with
# infra/deploy.sh: it tags the images with the commit and records it as RELEASE in .env, so any
# later `docker compose --env-file .env -f infra/docker-compose.deploy.yml ...` uses the live release.
# There is deliberately no default tag: an old default image once replaced the live agent.
# Opt-in Prometheus + Grafana (+ node-exporter and cAdvisor for host and container metrics): add
# `--profile observability` (public read-only at /grafana/ and /prometheus/, see the Caddyfile).
# Once it runs, infra/deploy.sh keeps it running and up to date on every deploy.
name: boundary-deploy

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boundary}
      POSTGRES_USER: ${POSTGRES_USER:-boundary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boundary} -d ${POSTGRES_DB:-boundary}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  agent:
    <<: *restart
    image: boundary-agent:${RELEASE:?no RELEASE in .env, run infra/deploy.sh first}
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boundary}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-boundary}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      # Sign-in (auth.py): accounts as name:password:role, and the key that signs session tokens.
      AUTH_USERS: ${AUTH_USERS:?set AUTH_USERS in .env (name:password:user|admin,...)}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -hex 32)}
      # Only Caddy can reach the agent (internal network, port not published), so trusting the
      # forwarded client IP it sets is safe; the rate limits then apply per real visitor.
      FORWARDED_ALLOW_IPS: "*"
      LLM_PROVIDER: litellm
      ALLOW_DEMO_MOCK_PLANNER: "false"
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      GUARD_POLICY_PATH: ${GUARD_POLICY_PATH-policies/guard.yaml}
      GUARD_TOOL_OUTPUT_ON_BLOCK: ${GUARD_TOOL_OUTPUT_ON_BLOCK:-continue}
      HF_TOKEN: ${HF_TOKEN:-}
      EXA_MCP_ENABLED: ${EXA_MCP_ENABLED:-true}
      EXA_API_KEY: ${EXA_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # Public demo: cap real LLM spend per day (built-in playground scenarios replay for free).
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-2}
      PLAYGROUND_ENABLED: ${PLAYGROUND_ENABLED:-true}
      PLAYGROUND_LIVE_RUNS: ${PLAYGROUND_LIVE_RUNS:-true}
      PLAYGROUND_MAX_INPUT_CHARS: ${PLAYGROUND_MAX_INPUT_CHARS:-8000}
      PLAYGROUND_SCANS_PER_MINUTE: ${PLAYGROUND_SCANS_PER_MINUTE:-30}
      PLAYGROUND_ATTACKS_PER_HOUR: ${PLAYGROUND_ATTACKS_PER_HOUR:-10}
    expose:
      - "8000"
    volumes:
      - hf_cache:/data/hf # model downloads (~2 GB), kept across releases
      - mcp_sandbox:/data/mcp-sandbox

  dashboard:
    <<: *restart
    image: boundary-dashboard:${RELEASE:?no RELEASE in .env, run infra/deploy.sh first}
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
      - agent
    expose:
      - "3000"

  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on:
      - agent
      - dashboard
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_EMAIL_DIRECTIVE: ${ACME_EMAIL:+email ${ACME_EMAIL}} # the Caddyfile's global email line, if any
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Observability (opt-in): --profile observability -------------------------------------------
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    # Public read-only at https://PUBLIC_HOST/prometheus/ (Caddy strips the prefix). The admin and
    # lifecycle APIs stay off (the default), and the query limits keep public queries cheap.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.external-url=https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}/prometheus/
      - --web.route-prefix=/
      - --query.timeout=20s
      - --query.max-concurrency=4
      - --query.max-samples=5000000
    volumes:
      - ./observability/prometheus.deploy.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    <<: *restart
    image: grafana/grafana:11.4.0
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      # Public read-only at https://PUBLIC_HOST/grafana/: anonymous viewers only, and no login form
      # or basic auth, so there's no admin sign-in to guess at (dashboards come from provisioning).
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/boundary-guard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  # Host and per-container CPU / memory / network for the "load & capacity" dashboard. Internal only
  # (no ports): Prometheus scrapes them over the compose network.
  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.8.2
    profiles: [observability]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    <<: *restart
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: [observability]
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  postgres_data:
  redis_data:
  hf_cache:
  mcp_sandbox:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
