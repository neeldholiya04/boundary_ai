[project]
name = "boundary-ai"
version = "0.1.0"
description = "Guardrails & safety layer for tool-calling LLM agents, with a red-team eval harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boundary-guard[ml]",
  "boundary-eval[build]",
  "boundary-agent",
  "boundary-sandbox-mcp",
  "boundary-detector",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  # For training the detector locally (boundary-detector[train]).
  "accelerate>=1.0",
  "scikit-learn>=1.5",
  "protobuf>=5.0",
  "locust>=2.30",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/agent", "apps/sandbox-mcp", "packages/guard", "packages/eval", "packages/detector"]

[tool.uv.sources]
# CPU-only PyTorch on Linux (CI and servers); the default wheel there bundles CUDA (~2.5 GB).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
boundary-guard = { workspace = true }
boundary-eval = { workspace = true }
boundary-detector = { workspace = true }
boundary-agent = { workspace = true }
boundary-sandbox-mcp = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["packages/guard/tests", "packages/eval/tests", "packages/detector/tests", "apps/agent/tests", "apps/sandbox-mcp/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = ["packages/guard/tests", "packages/eval/tests", "apps/agent/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Notebooks are Colab-idiomatic (shell magics, terse cells); don't lint them.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["boundary_guard", "boundary_eval", "boundary_detector", "boundary_agent", "boundary_mcp", "guard_testkit"]

# FastAPI's `Depends(...)` in argument defaults is the framework's intended pattern, not a
# mutable-default bug.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
