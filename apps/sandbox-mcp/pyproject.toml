[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-sandbox-mcp"
version = "0.1.0"
description = "Sandboxed file MCP server for the boundary-ai agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
