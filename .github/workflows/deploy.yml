name: deploy

# Deploys to the EC2 server after CI passes on main, or on demand (e.g. a rollback to an older
# commit). No SSH key and no open port: GitHub's OIDC token assumes a narrowly scoped AWS role, and
# the deploy runs on the server through AWS Systems Manager (SSM) Run Command. A smoke test of the
# access rules runs against the live site afterwards.
#
# Inert until the `production` environment has the AWS_DEPLOY_ROLE_ARN variable (setup:
# docs/DEPLOY.md, part 3), so forks and a not-yet-provisioned repo stay green.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag or branch to deploy (default: latest main). An older SHA rolls back."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # the OIDC token AWS trusts

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Only after a successful CI run for a push to main (not for PRs), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Skip when the deploy target isn't configured
        id: configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::notice::production environment not configured (AWS_DEPLOY_ROLE_ARN / EC2_INSTANCE_ID); skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the commit
        if: steps.configured.outputs.ok == 'true'
        id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-${{ steps.rev.outputs.short }}

      - name: Deploy on the server (SSM Run Command)
        if: steps.configured.outputs.ok == 'true'
        env:
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          # Runs as the ubuntu user: fetch, check out the exact commit, run infra/deploy.sh from it.
          cmd="sudo -iu ubuntu bash -c 'set -e; cd ~/boundary_ai; git fetch --quiet origin; git checkout --quiet --detach $SHA; infra/deploy.sh'"
          params=$(jq -n --arg c "$cmd" '{commands: [$c], executionTimeout: ["3000"]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:12}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 300); do # up to 50 minutes (a first build plus model download)
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -60
          echo "deploy status: $status"
          [ "$status" = Success ]

      - name: Smoke test the live site
        if: steps.configured.outputs.ok == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: infra/smoke-test.sh "${{ vars.PUBLIC_URL }}" "${{ vars.ADMIN_URL }}"
